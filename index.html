<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Quest Log</title>
    <link rel="icon" type="image/png" href="IMAGES/favicon.png">
    <link rel="apple-touch-icon" type="image/png" href="IMAGES/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f4e4bc;
            --panel-bg: #fff8dc;
            --border: #8b4513;
            --text: #3e2723;
            --accent: #4caf50;
            --danger: #d32f2f;
            --secondary: #ff9800;
            --success: #2e7d32;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 4px solid var(--border);
            padding: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        h1 { text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select, button {
            padding: 8px;
            border: 2px solid var(--border);
            background: #fff;
            font-family: inherit;
            font-size: 1rem;
        }

        button {
            cursor: pointer;
            background: var(--accent);
            color: white;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        button.secondary { background: var(--secondary); color: black; }
        button.refresh-btn { background: #2196F3; }
        button.login-btn { background: #6f42c1; color: white; }

        .quest-section { margin-bottom: 30px; }
        .section-title { 
            border-bottom: 2px dashed var(--border); 
            padding-bottom: 5px; 
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .quest-list { list-style: none; padding: 0; }
        
        .quest-item {
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            padding: 10px;
            position: relative;
            cursor: grab;
        }

        .quest-item.dragging { opacity: 0.5; }

        .quest-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quest-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .editable-title {
            flex-grow: 1;
            font-weight: bold;
            border: 1px dashed transparent;
            padding: 2px 4px;
            background: transparent;
            min-width: 0; /* Allows flex to shrink */
            color: var(--text);
            word-break: break-word;
            line-height: 1.4;
            cursor: text;
            white-space: normal; /* Allow wrapping */
            /* NO line-clamp here - let it flow naturally */
        }
        .editable-title:focus {
            border-color: var(--border);
            background: #fff;
            outline: none;
        }

        .quest-meta {
            font-size: 0.8rem;
            color: #666;
            margin-left: auto;
            min-width: 100px;
            text-align: right;
        }

        .subtasks {
            margin-left: 30px;
            margin-top: 10px;
            border-left: 2px solid var(--border);
            padding-left: 10px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .subtask-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            border-bottom: 1px dotted #ccc;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .subtask-input:focus {
            border-bottom: 1px solid var(--border);
            outline: none;
        }

        .add-subtask-btn {
            font-size: 0.8rem;
            padding: 2px 6px;
            background: #ddd;
            color: #333;
        }

        .status-container {
            text-align: center;
            margin-bottom: 10px;
            min-height: 24px;
        }
        .status-msg {
            font-style: italic;
            color: #555;
            display: none;
        }
        .autosave-status {
            font-weight: bold;
            color: var(--secondary);
            display: inline-block;
        }
        .saving { color: #ff9800; }
        .complete { color: var(--success); }
        .idle { color: #666; }

        .admin-panel {
            background: #fff;
            border: 2px solid var(--border);
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .admin-panel.active { display: block; }

        .login-modal {
            display: none !important;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .login-modal.show {
            display: flex !important;
        }
        .login-box {
            background: var(--panel-bg);
            padding: 30px;
            border: 4px solid var(--border);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10001;
        }
        .login-box textarea {
            width: 100%;
            height: 80px;
            margin: 10px 0;
            font-family: monospace;
            border: 2px solid var(--border);
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌾 Quest Log</h1>
        
        <div class="status-container">
            <span id="statusMsg" class="status-msg">Loading...</span>
            <span id="autosaveStatus" class="autosave-status idle">💾 Autosave on</span>
        </div>

        <div id="adminPanel" class="admin-panel">
            <h3>✏️ Editor Mode Active</h3>
            <div class="controls">
                <input type="text" id="newTaskInput" placeholder="New Quest Name...">
                <select id="seasonSelect">
                    <option value="">No Due Date</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Fall">Fall</option>
                    <option value="Winter">Winter</option>
                </select>
                <input type="number" id="dayInput" min="1" max="28" placeholder="Day" style="width: 60px;">
                <button onclick="addTask()">Add Quest</button>
            </div>
        </div>

        <div class="controls">
            <button class="refresh-btn" onclick="fetchData()">🔄 Refresh</button>
            <button class="login-btn" id="loginBtn" onclick="showLogin()">🔑 Login to Edit</button>
            <div id="lockStatus" class="locked-msg" style="margin-left: 10px;">View Only</div>
        </div>

        <div class="quest-section">
            <div class="section-title">Active Quests</div>
            <ul id="activeList" class="quest-list"></ul>
        </div>

        <div class="quest-section">
            <div class="section-title">Completed Quests</div>
            <ul id="completedList" class="quest-list"></ul>
        </div>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 20px; font-size: 0.75rem; color: #888;">
            Last Commit: <span id="commitSha">Loading...</span>
        </div>
        <!-- Update Banner (hidden by default) -->
        <div id="updateBanner" style="display: none; background: #ff9800; color: white; padding: 10px; text-align: center; margin-bottom: 10px; border-radius: 4px;">
            ⚠️ New version available! <button onclick="location.reload()" style="background: white; color: #ff9800; margin-left: 10px; padding: 4px 8px;">Refresh Now</button>
        </div>
    </div>

    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h3>Login to Edit</h3>
            <p>Paste your GitHub Personal Access Token below:</p>
            <textarea id="tokenInput" placeholder="github_pat_..."></textarea>
            <div style="display:flex; gap:10px; justify-content:center; margin-top: 10px;">
                <button onclick="saveToken()">Login</button>
                <button class="danger" onclick="closeLogin()">Cancel</button>
            </div>
            <p style="font-size: 0.8rem; color: #666; margin-top: 15px;">
                Token starts with: <code>github_pat_</code>
            </p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const OWNER = 'c0deNoodle'; // Your Github username
        const REPO = 'stardew-list';          // Your repo name
        const FILE_PATH = 'quests.json';      // The data file
        const BRANCH = 'main';

        let currentData = [];
        let authToken = localStorage.getItem('gh_token');
        let isAdmin = !!authToken;
        let sortableActive = null;
        let saveTimeout = null;

        // --- STATUS INDICATOR LOGIC ---
        function setStatus(state, message = "") {
            const statusMsg = document.getElementById('statusMsg');
            const autosaveStatus = document.getElementById('autosaveStatus');

            if (state === 'idle') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Autosave on";
                autosaveStatus.className = "autosave-status idle";
            } else if (state === 'saving') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Saving to GitHub...";
                autosaveStatus.className = "autosave-status saving";
            } else if (state === 'complete') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Autosave complete";
                autosaveStatus.className = "autosave-status complete";
                setTimeout(() => {
                    if(autosaveStatus.innerText.includes("complete")) {
                        setStatus('idle');
                    }
                }, 2000);
            } else if (state === 'error') {
                statusMsg.style.display = 'inline-block';
                statusMsg.innerText = message;
                statusMsg.style.color = 'var(--danger)';
                autosaveStatus.style.display = 'none';
            } else if (state === 'loading') {
                statusMsg.style.display = 'inline-block';
                statusMsg.innerText = message;
                statusMsg.style.color = '#555';
                autosaveStatus.style.display = 'none';
            }
        }

        // --- AUTOSAVE LOGIC ---
        function triggerAutosave() {
            if (!isAdmin) return;
            
            if (saveTimeout) clearTimeout(saveTimeout);
            setStatus('saving');

            saveTimeout = setTimeout(async () => {
                await saveData();
            }, 1000);
        }

        // --- DATA FETCHING ---
        async function fetchData() {
            setStatus('loading', "Loading...");

            try {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                const headers = {};
                if (authToken) headers['Authorization'] = `token ${authToken}`;

                const response = await fetch(url, { headers });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        currentData = [];
                        render();
                        setStatus('idle');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const json = await response.json();
                const content = atob(json.content);
                currentData = JSON.parse(content);
                
                render();
                setStatus('idle');
            } catch (e) {
                console.error(e);
                setStatus('error', "Error loading data.");
            }
        }

        // --- SAVING DATA ---
        async function saveData() {
            if (!authToken) return;

            try {
                const getUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                const headers = { 'Authorization': `token ${authToken}` };
                const getRes = await fetch(getUrl, { headers });
                
                if (!getRes.ok) {
                    const newContent = btoa(JSON.stringify(currentData, null, 2));
                    const putUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                    const putBody = {
                        message: "Create quest log",
                        content: newContent,
                        branch: BRANCH
                    };
                    await fetch(putUrl, { method: 'PUT', headers, body: JSON.stringify(putBody) });
                } else {
                    const fileInfo = await getRes.json();
                    const newContent = btoa(JSON.stringify(currentData, null, 2));
                    const putUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                    const putBody = {
                        message: "Update quest log",
                        content: newContent,
                        sha: fileInfo.sha,
                        branch: BRANCH
                    };
                    await fetch(putUrl, { method: 'PUT', headers, body: JSON.stringify(putBody) });
                }

                setStatus('complete');
            } catch (e) {
                console.error(e);
                setStatus('error', "Save failed: " + e.message);
            }
        }

        // --- UI LOGIC ---
        function render() {
            const activeList = document.getElementById('activeList');
            const completedList = document.getElementById('completedList');
            
            activeList.innerHTML = '';
            completedList.innerHTML = '';

            const activeTasks = currentData.filter(t => !t.completed);
            const completedTasks = currentData.filter(t => t.completed);

            activeTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'quest-item';
                li.dataset.index = index; 
                
                const isAllSubtasksDone = task.subtasks.length === 0 || task.subtasks.every(st => st.done);
                const shouldCheck = task.completed || (task.subtasks.length > 0 && isAllSubtasksDone);

                li.innerHTML = `
                    <div class="quest-header">
                        <input type="checkbox" class="quest-checkbox" 
                            ${shouldCheck ? 'checked' : ''} 
                            ${isAdmin ? '' : 'disabled'}
                            onchange="toggleTask(${index})">
                        ${isAdmin ? 
                            `<div class="editable-title" contenteditable="true" onblur="updateTitle(${index}, this.innerText)" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}">${escapeHtml(task.title)}</div>` : 
                            `<span class="quest-text">${escapeHtml(task.title)}</span>`
                        }
                        <span class="quest-meta">${task.season ? `${task.season} ${task.day}` : ''}</span>
                        ${isAdmin ? `<button class="danger" style="padding:2px 6px; font-size:0.8rem;" onclick="deleteTask(${index})">✕</button>` : ''}
                    </div>
                    <div class="subtasks" id="subtasks-${index}"></div>
                    ${isAdmin ? `<button class="add-subtask-btn" onclick="addSubtask(${index})">+ Subtask</button>` : ''}
                `;
                activeList.appendChild(li);
                renderSubtasks(index, task.subtasks);
            });

            completedTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'quest-item';
                li.style.opacity = '0.7';
                li.innerHTML = `
                    <div class="quest-header">
                        <input type="checkbox" disabled checked>
                        ${isAdmin ? 
                            `<input type="text" class="editable-title" value="${escapeHtml(task.title)}" onchange="updateTitle(${index}, this.value)">` : 
                            `<span class="quest-text" style="text-decoration: line-through;">${escapeHtml(task.title)}</span>`
                        }
                        <span class="quest-meta">${task.season ? `${task.season} ${task.day}` : ''}</span>
                        ${isAdmin ? `<button class="secondary" style="padding:2px 6px; font-size:0.8rem;" onclick="restoreTask(${index})">Restore</button>` : ''}
                    </div>
                `;
                completedList.appendChild(li);
            });

            if (isAdmin) initSortable();
        }

        function renderSubtasks(parentIndex, subtasks) {
            const container = document.getElementById(`subtasks-${parentIndex}`);
            if(!container) return;
            
            subtasks.forEach((st, stIndex) => {
                const div = document.createElement('div');
                div.className = 'subtask-item';
                div.innerHTML = `
                    <input type="checkbox" ${st.done ? 'checked' : ''} ${isAdmin ? '' : 'disabled'} onchange="toggleSubtask(${parentIndex}, ${stIndex})">
                    ${isAdmin ? 
                        `<input type="text" class="subtask-input" value="${escapeHtml(st.text)}" onchange="updateSubtext(${parentIndex}, ${stIndex}, this.value)">` : 
                        `<span class="subtask-input">${escapeHtml(st.text)}</span>`
                    }
                    ${isAdmin ? `<button class="danger" style="padding:2px 5px; font-size:0.8rem;" onclick="deleteSubtask(${parentIndex}, ${stIndex})">x</button>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- ACTIONS ---
        function addTask() {
            const title = document.getElementById('newTaskInput').value;
            const season = document.getElementById('seasonSelect').value;
            const day = document.getElementById('dayInput').value;

            if (!title) return alert("Enter a quest name!");

            currentData.unshift({
                id: Date.now().toString(),
                title: title,
                season: season,
                day: day,
                completed: false,
                subtasks: []
            });
            
            document.getElementById('newTaskInput').value = '';
            render();
            triggerAutosave();
        }

        function toggleTask(index) {
            const task = currentData[index];
            if (!task.completed) {
                if (task.subtasks.length > 0 && !task.subtasks.every(st => st.done)) {
                    alert("Complete all subtasks first!");
                    render(); 
                    return;
                }
            }
            task.completed = !task.completed;
            render();
            triggerAutosave();
        }

        function restoreTask(completedIndex) {
            let count = 0;
            let targetTask = null;
            for(let t of currentData) {
                if(t.completed) {
                    if(count === completedIndex) {
                        targetTask = t;
                        break;
                    }
                    count++;
                }
            }
            if(targetTask) {
                targetTask.completed = false;
                render();
                triggerAutosave();
            }
        }

        function deleteTask(index) {
            if(confirm("Delete this quest?")) {
                currentData.splice(index, 1);
                render();
                triggerAutosave();
            }
        }

        function addSubtask(parentIndex) {
            currentData[parentIndex].subtasks.push({ text: "", done: false });
            render();
            setTimeout(() => {
                const inputs = document.querySelectorAll(`#subtasks-${parentIndex} input[type="text"]`);
                if(inputs.length > 0) inputs[inputs.length - 1].focus();
            }, 50);
            triggerAutosave();
        }

        function toggleSubtask(parentIndex, subIndex) {
            currentData[parentIndex].subtasks[subIndex].done = !currentData[parentIndex].subtasks[subIndex].done;
            render();
            triggerAutosave();
        }

        function updateSubtext(parentIndex, subIndex, val) {
            currentData[parentIndex].subtasks[subIndex].text = val;
            triggerAutosave();
        }

        function deleteSubtask(parentIndex, subIndex) {
            currentData[parentIndex].subtasks.splice(subIndex, 1);
            render();
            triggerAutosave();
        }

        function updateTitle(index, val) {
            currentData[index].title = val;
            triggerAutosave();
        }

        // --- DRAG AND DROP ---
        function initSortable() {
            if(sortableActive) sortableActive.destroy();
            sortableActive = Sortable.create(document.getElementById('activeList'), {
                animation: 150,
                ghostClass: 'dragging',
                onEnd: function(evt) {
                    const item = currentData.splice(evt.oldIndex, 1)[0];
                    currentData.splice(evt.newIndex, 0, item);
                    render();
                    triggerAutosave();
                }
            });
        }

        // --- LOGIN LOGIC ---
        function showLogin() {
            console.log("showLogin called");
            const modal = document.getElementById('loginModal');
            if (modal) {
                modal.classList.add('show');
                modal.style.display = 'flex';
                document.getElementById('tokenInput').focus();
            } else {
                console.error("Modal element not found!");
            }
        }

        function closeLogin() {
            const modal = document.getElementById('loginModal');
            if (modal) {
                modal.classList.remove('show');
                modal.style.display = 'none';
            }
        }

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            console.log("Token submitted:", token.substring(0, 15) + "...");
            
            if (token && token.includes('pat_')) {
                localStorage.setItem('gh_token', token);
                authToken = token;
                isAdmin = true;
                closeLogin();
                updateUIState();
                fetchData();
            } else {
                alert("Invalid token format. Must contain 'pat_' (e.g., github_pat_...)");
            }
        }

        function updateUIState() {
            const adminPanel = document.getElementById('adminPanel');
            const loginBtn = document.getElementById('loginBtn');
            const lockStatus = document.getElementById('lockStatus');

            if (isAdmin) {
                adminPanel.classList.add('active');
                loginBtn.style.display = 'none';
                lockStatus.innerText = "Editing Enabled";
                lockStatus.style.color = "green";
                setStatus('idle');
            } else {
                adminPanel.classList.remove('active');
                loginBtn.style.display = 'inline-block';
                lockStatus.innerText = "View Only";
                lockStatus.style.color = "#666";
                setStatus('idle');
            }
        }

        // --- FETCH LATEST COMMIT ---
        async function fetchLatestCommit() {
            try {
                // Add timestamp to prevent caching
                const timestamp = new Date().getTime();
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${FILE_PATH}&per_page=1&_t=${timestamp}`;
                const headers = {};
                if (authToken) headers['Authorization'] = `token ${authToken}`;

                const response = await fetch(url, { headers, cache: 'no-cache' });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const sha = data[0].sha.substring(0, 7);
                        document.getElementById('commitSha').innerText = sha;
                        checkForUpdates(sha);
                    } else {
                        document.getElementById('commitSha').innerText = "N/A";
                    }
                } else {
                    console.error("API Error:", response.status);
                    document.getElementById('commitSha').innerText = "Error";
                }
            } catch (e) {
                console.error("Failed to fetch commit:", e);
                document.getElementById('commitSha').innerText = "Unavailable";
            }
        }

        // --- CHECK FOR UPDATES ---
        function checkForUpdates(latestSha) {
            const storedSha = localStorage.getItem('lastCommitSha');
            const updateBanner = document.getElementById('updateBanner');
            
            if (storedSha && storedSha !== latestSha) {
                // New version available
                updateBanner.style.display = 'block';
            } else {
                updateBanner.style.display = 'none';
            }
            
            // Store current SHA for next comparison
            localStorage.setItem('lastCommitSha', latestSha);
        }

        // --- INIT ---
        window.onload = function() {
            updateUIState();
            fetchData();
            fetchLatestCommit();
        };
    </script>
</body>
</html>
