<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Quest Log</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f4e4bc;
            --panel-bg: #fff8dc;
            --border: #8b4513;
            --text: #3e2723;
            --accent: #4caf50;
            --danger: #d32f2f;
            --secondary: #ff9800;
            --success: #2e7d32;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 4px solid var(--border);
            padding: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        h1 { text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select, button {
            padding: 8px;
            border: 2px solid var(--border);
            background: #fff;
            font-family: inherit;
            font-size: 1rem;
        }

        button {
            cursor: pointer;
            background: var(--accent);
            color: white;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        button.secondary { background: var(--secondary); color: black; }
        button.refresh-btn { background: #2196F3; }
        button.login-btn { background: #6f42c1; color: white; }

        .quest-section { margin-bottom: 30px; }
        .section-title { 
            border-bottom: 2px dashed var(--border); 
            padding-bottom: 5px; 
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .quest-list { list-style: none; padding: 0; }
        
        .quest-item {
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            padding: 10px;
            position: relative;
            cursor: grab;
        }

        .quest-item.dragging { opacity: 0.5; }

        .quest-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quest-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .editable-title {
            flex-grow: 1;
            font-weight: bold;
            border: 1px dashed transparent;
            padding: 2px;
            background: transparent;
            width: 100%;
            color: var(--text);
        }
        .editable-title:focus {
            border-color: var(--border);
            background: #fff;
            outline: none;
        }

        .quest-meta {
            font-size: 0.8rem;
            color: #666;
            margin-left: auto;
            min-width: 100px;
            text-align: right;
        }

        .subtasks {
            margin-left: 30px;
            margin-top: 10px;
            border-left: 2px solid var(--border);
            padding-left: 10px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .subtask-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            border-bottom: 1px dotted #ccc;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .subtask-input:focus {
            border-bottom: 1px solid var(--border);
            outline: none;
        }

        .add-subtask-btn {
            font-size: 0.8rem;
            padding: 2px 6px;
            background: #ddd;
            color: #333;
        }

        .status-container {
            text-align: center;
            margin-bottom: 10px;
            min-height: 24px;
        }
        .status-msg {
            font-style: italic;
            color: #555;
            display: none;
        }
        .autosave-status {
            font-weight: bold;
            color: var(--secondary);
            display: inline-block;
        }
        .saving { color: #ff9800; }
        .complete { color: var(--success); }
        .idle { color: #666; }

        .admin-panel {
            background: #fff;
            border: 2px solid var(--border);
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .admin-panel.active { display: block; }

        .login-modal {
            display: none !important;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .login-modal.show {
            display: flex !important;
        }
        .login-box {
            background: var(--panel-bg);
            padding: 30px;
            border: 4px solid var(--border);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10001;
        }
        .login-box textarea {
            width: 100%;
            height: 80px;
            margin: 10px 0;
            font-family: monospace;
            border: 2px solid var(--border);
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌾 Quest Log</h1>
        
        <div class="status-container">
            <span id="statusMsg" class="status-msg">Loading...</span>
            <span id="autosaveStatus" class="autosave-status idle">💾 Autosave on</span>
        </div>

        <div id="adminPanel" class="admin-panel">
            <h3>✏️ Editor Mode Active</h3>
            <div class="controls">
                <input type="text" id="newTaskInput" placeholder="New Quest Name...">
                <select id="seasonSelect">
                    <option value="">No Due Date</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Fall">Fall</option>
                    <option value="Winter">Winter</option>
                </select>
                <input type="number" id="dayInput" min="1" max="28" placeholder="Day" style="width: 60px;">
                <button onclick="addTask()">Add Quest</button>
            </div>
        </div>

        <div class="controls">
            <button class="refresh-btn" onclick="fetchData()">🔄 Refresh</button>
            <button class="login-btn" id="loginBtn" onclick="showLogin()">🔑 Login to Edit</button>
            <div id="lockStatus" class="locked-msg" style="margin-left: 10px;">View Only</div>
        </div>

        <div class="quest-section">
            <div class="section-title">Active Quests</div>
            <ul id="activeList" class="quest-list"></ul>
        </div>

        <div class="quest-section">
            <div class="section-title">Completed Quests</div>
            <ul id="completedList" class="quest-list"></ul>
        </div>
    </div>

    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h3>Login to Edit</h3>
            <p>Paste your GitHub Personal Access Token below:</p>
            <textarea id="tokenInput" placeholder="github_pat_..."></textarea>
            <div style="display:flex; gap:10px; justify-content:center; margin-top: 10px;">
                <button onclick="saveToken()">Login</button>
                <button class="danger" onclick="closeLogin()">Cancel</button>
            </div>
            <p style="font-size: 0.8rem; color: #666; margin-top: 15px;">
                Token starts with: <code>github_pat_</code>
            </p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const OWNER = 'c0deNoodle';           // Your Github username
        const REPO = 'stardew-list';          // Your repo name
        const FILE_PATH = 'quests.json';      // The data file
        const BRANCH = 'main';

        let currentData = [];
        let authToken = localStorage.getItem('gh_token');
        let isAdmin = !!authToken;
        let sortableActive = null;
        let saveTimeout = null;

        // --- STATUS INDICATOR LOGIC ---
        function setStatus(state, message = "") {
            const statusMsg = document.getElementById('statusMsg');
            const autosaveStatus = document.getElementById('autosaveStatus');

            if (state === 'idle') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Autosave on";
                autosaveStatus.className = "autosave-status idle";
            } else if (state === 'saving') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Saving to GitHub...";
                autosaveStatus.className = "autosave-status saving";
            } else if (state === 'complete') {
                statusMsg.style.display = 'none';
                autosaveStatus.style.display = 'inline-block';
                autosaveStatus.innerText = "💾 Autosave complete";
                autosaveStatus.className = "autosave-status complete";
                setTimeout(() => {
                    if(autosaveStatus.innerText.includes("complete")) {
                        setStatus('idle');
                    }
                }, 2000);
            } else if (state === 'error') {
                statusMsg.style.display = 'inline-block';
                statusMsg.innerText = message;
                statusMsg.style.color = 'var(--danger)';
                autosaveStatus.style.display = 'none';
            } else if (state === 'loading') {
                statusMsg.style.display = 'inline-block';
                statusMsg.innerText = message;
                statusMsg.style.color = '#555';
                autosaveStatus.style.display = 'none';
            }
        }

        // --- AUTOSAVE LOGIC ---
        function triggerAutosave() {
            if (!isAdmin) return;
            
            if (saveTimeout) clearTimeout(saveTimeout);
            setStatus('saving');

            saveTimeout = setTimeout(async () => {
                await saveData();
            }, 1000);
        }

        // --- DATA FETCHING ---
        async function fetchData() {
            setStatus('loading', "Loading...");

            try {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                const headers = {};
                if (authToken) headers['Authorization'] = `token ${authToken}`;

                const response = await fetch(url, { headers });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        currentData = [];
                        render();
                        setStatus('idle');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const json = await response.json();
                const content = atob(json.content);
                currentData = JSON.parse(content);
                
                render();
                setStatus('idle');
            } catch (e) {
                console.error(e);
                setStatus('error', "Error loading data.");
            }
        }

        // --- SAVING DATA ---
        async function saveData() {
            if (!authToken) return;

            try {
                const getUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
                const headers = { 'Authorization': `token ${authToken}` };
                const getRes = await fetch(getUrl, { headers });
