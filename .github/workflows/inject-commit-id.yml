name: Inject Commit ID & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # This step finds "VERSION-PLACEHOLDER" in index.html and replaces it with the actual Commit SHA
      - name: Inject Commit ID into index.html
        run: |
          echo "Current Commit SHA: ${{ github.sha }}"
          sed -i "s/content=\"VERSION-PLACEHOLDER\"/content=\"${{ github.sha }}\"/" index.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
