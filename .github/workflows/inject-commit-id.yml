name: Inject Commit ID & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Needed to see full git history for index.html

      - name: Inject Commit ID into index.html
        run: |
          CURRENT_SHA="${{ github.sha }}"
          
          # Check if index.html was modified IN THIS SPECIFIC COMMIT
          if git diff-tree --no-commit-id --name-only -r $CURRENT_SHA | grep -q "^index\.html$"; then
            echo "index.html changed in this commit ($CURRENT_SHA). Injecting new SHA."
            # Replace placeholder with the NEW commit SHA
            sed -i "s/content=\"VERSION-PLACEHOLDER\"/content=\"$CURRENT_SHA\"/" index.html
          else
            echo "index.html unchanged in this commit. Fetching LAST known index.html commit."
            
            # Try to get history
            LAST_INDEX_SHA=$(git log -n 1 --format="%H" -- index.html 2>/dev/null)
            
            if [ -z "$LAST_INDEX_SHA" ]; then
              echo "No history found for index.html. Using current commit SHA."
              LAST_INDEX_SHA="$CURRENT_SHA"
            fi
            
            echo "Injecting SHA: $LAST_INDEX_SHA"
            sed -i "s/content=\"VERSION-PLACEHOLDER\"/content=\"$LAST_INDEX_SHA\"/" index.html
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
